# El catálogo ahora vive en GitHub Pages (softgalamx.github.io). Netlify solo reenvía los enlaces y QR anteriores
# (https://chulas-boutique.netlify.app/...) a la misma página en GitHub.
[build]
  publish = "chulas-boutique"
  command = ""

[[redirects]]
  from = "/*"
  to = "https://softgalamx.github.io/chulas-boutique/:splat"
  status = 301
  force = true
